# The Windows release files of a tag (tools/make_launcher.py), built on a Windows runner and kept as this run's
# artifact. The shader translator is a NativeAOT exe, which only Windows can build, and nx2navi_dlssg.dll needs MSVC
# (tools/build_dlssg.py). This workflow publishes nothing and has no write access: the release workflow
# (.github/workflows/release.yml) calls it, checks, attests and publishes its files. Started by hand it is a test
# build of a tag or a branch, kept as an artifact for 14 days.
# AMD's signed FSR libraries come from AMD's FidelityFX SDK repository at the tags the runtime was written against,
# checked against their SHA-256; NVIDIA's DLSS and Streamline files are downloaded and checked by the pins in tools/.
# No cache is read or written: a release is built from the tag's sources and the pinned downloads alone.
name: Windows release files

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (v0.19.0-rc.1)'
        type: string
        required: true
      ref:
        description: "Commit to build (the tag's commit, as the release workflow resolved it)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose sources are built (v0.12.1), or a branch to try a build of'
        required: true
      notes_ref:
        description: 'Branch or tag whose docs/releases/<tag>.md gives the manifest notes'
        default: main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      # empty when the release workflow calls: the notes are then the tag's own docs/releases/<tag>.md
      NOTES_REF: ${{ inputs.notes_ref }}
      PY: uv run --no-project --python 3.14 --with numpy python
      # make_launcher runs the release's own tools/make_game.py for the prebuilt runtime; a __pycache__ it left in the
      # release's tools/ would be refused by the release's content check (check_content's .pyc folds its marker)
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - name: Tools on PATH
        # NativeAOT finds MSVC through vswhere (docs/building.md). The runtime's own shaders are compiled with MSYS2
        # UCRT64's glslc, spirv-as and spirv-val (tools/build_shaders.py looks in C:\msys64\ucrt64\bin), which the
        # runner's MSYS2 installs from its packages
        run: |
          echo 'C:\Program Files (x86)\Microsoft Visual Studio\Installer' >> "$GITHUB_PATH"
          uv python install -q 3.14
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-spirv-tools
          /c/msys64/ucrt64/bin/glslc.exe --version | head -1
      - name: Notes
        # Called by the release workflow: docs/releases/<tag>.md of the tag's commit, which must exist (the manifest
        # keeps these notes for good). Started by hand: docs/releases/<tag>.md from notes_ref; for a branch, or a tag
        # without notes there, those of the checkout's VERSION (none when it has no notes file either)
        run: |
          if [ -z "$NOTES_REF" ]; then
            cp "docs/releases/$TAG.md" "$RUNNER_TEMP/notes.md"
          else
            git fetch -q --depth 1 origin "$NOTES_REF"
            if ! git show "FETCH_HEAD:docs/releases/$TAG.md" > "$RUNNER_TEMP/notes.md" 2>/dev/null; then
              notes="docs/releases/v$(tr -d '\r\n' < VERSION).md"
              if [ -f "$notes" ]; then cp "$notes" "$RUNNER_TEMP/notes.md"; else : > "$RUNNER_TEMP/notes.md"; fi
              echo "no docs/releases/$TAG.md on $NOTES_REF: the notes of $notes"
            fi
          fi
          head -3 "$RUNNER_TEMP/notes.md"
      - name: AMD FSR 3.1 and FSR 4 libraries
        run: |
          base=https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/raw
          amd="$RUNNER_TEMP/amd"
          mkdir -p "$amd/ffx3" "$amd/ffx4"
          curl -fsSL --retry 3 -o "$amd/ffx3/amd_fidelityfx_vk.dll" "$base/v1.1.4/PrebuiltSignedDLL/amd_fidelityfx_vk.dll"
          for n in loader upscaler framegeneration; do
            curl -fsSL --retry 3 -o "$amd/ffx4/amd_fidelityfx_${n}_vk.dll" \
              "$base/v2.4.0/Kits/FidelityFX/signedbin/amd_fidelityfx_${n}_vk.dll"
          done
          (cd "$amd" && sha256sum -c - <<'EOF'
          a1624cc4238fef046f30c4d80ce3f47be63fc5f5373f49e3ee9edb9960f54c78  ffx3/amd_fidelityfx_vk.dll
          38a56a01fb3565c0757d9f5c1e4e69de4b65e5f2e5769b323b200dc1f142bab9  ffx4/amd_fidelityfx_loader_vk.dll
          4a7e895af6e0b615d40a84d59eb8c2b1054ad91cdd0c739567940270d51bdab7  ffx4/amd_fidelityfx_upscaler_vk.dll
          d002dabff8c5e71eaa715fc99438cd4dc81230262a7897b16bc402efec3498b4  ffx4/amd_fidelityfx_framegeneration_vk.dll
          EOF
          )
      - name: Shader translator
        run: $PY tools/build_xlate.py
      - name: DLSS Frame Generation DLL
        # The whole Streamline SDK (the archive tools/streamline_pin.py pins, checked against its SHA-256): its headers
        # for tools/build_dlssg.py, and the same folder as make_launcher's --streamline, which checks its DLLs
        run: |
          $PY tools/vulkan_pin.py --dest toolchain/vulkan-headers
          read -r url sha < <($PY -c 'import sys; sys.path.insert(0, "tools"); import streamline_pin as s; print(s.URL, s.SHA256)' | tail -1 | tr -d '\r')
          curl -fsSL --retry 3 -o toolchain/streamline-sdk.zip "$url"
          echo "$sha  toolchain/streamline-sdk.zip" | sha256sum -c -
          $PY -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' toolchain/streamline-sdk.zip toolchain/streamline-sdk
          rm toolchain/streamline-sdk.zip
          test -f toolchain/streamline-sdk/include/sl.h
          $PY tools/build_dlssg.py --sl toolchain/streamline-sdk --vulkan toolchain/vulkan-headers/include --out build/dlssg
      - name: Release files
        run: |
          $PY tools/make_launcher.py --xlate build/xlate --ffx "$RUNNER_TEMP/amd/ffx3/amd_fidelityfx_vk.dll" \
            --ffx4 "$RUNNER_TEMP/amd/ffx4" --dlssg build/dlssg/nx2navi_dlssg.dll --streamline toolchain/streamline-sdk \
            --feed "${{ github.repository }}" --notes "$RUNNER_TEMP/notes.md"
          cd build/launcher-release
          ls -la
          sha256sum NX2Saria-Setup-*.exe NX2Saria-app-*.zip NX2Saria-runtime-*.zip NX2Saria-update.json NX2navi-update.json
      - name: Button art in the release
        # The launcher's build draws the Xbox, PlayStation, Steam Deck and keyboard prompts from app/<version>/prompt-art
        # (tools/make_game.py, its prompts step); a release without it leaves the Controls menu saying their files are
        # missing (issue #15). Every picture prompt-art/SHA256SUMS lists, with that SHA-256, and SOURCE.md.
        run: |
          $PY - build/launcher-release/NX2Saria-app-*.zip <<'EOF'
          import hashlib, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = set(z.namelist())
          want = dict(reversed(line.split('  ', 1)) for line in open('prompt-art/SHA256SUMS', encoding='utf-8').read().splitlines())
          bad = [rel for rel, digest in want.items()
                 if f'prompt-art/{rel}' not in names or hashlib.sha256(z.read(f'prompt-art/{rel}')).hexdigest() != digest]
          if 'prompt-art/SOURCE.md' not in names:
              bad.append('SOURCE.md')
          if bad:
              print(f'::error::{sys.argv[1]}: {len(bad)} of the button art files missing or different: {bad[:5]}')
              sys.exit(1)
          print(f'{sys.argv[1]}: button art complete ({len(want)} pictures and SOURCE.md)')
          EOF
      - id: artifact
        # an artifact name has no "/": a test build of a branch such as fix/x keeps windows-release-fix-x
        run: echo "name=windows-release-${TAG//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/launcher-release/NX2Saria-Setup-*.exe
            build/launcher-release/NX2Saria-app-*.zip
            build/launcher-release/NX2Saria-runtime-*.zip
            build/launcher-release/NX2Saria-update.json
            build/launcher-release/NX2navi-update.json
