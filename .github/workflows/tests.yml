# tests/run.py on a Linux runner: every check under tests/ that needs neither the game's files nor its executable, a GPU
# nor Windows (the tests say what they need in their "# needs:" lines; the runner skips the rest and names why). The
# known failures of tests/known_failures.txt run and are listed apart; any other failure fails the job. Each test's
# output is kept as an artifact when the job fails.
# Python packages come by version and SHA-256 (tools/ci_requirements_tests.txt); VMA and the Vulkan headers are the
# pinned ones the build fetches (tools/build_game.py vma_include, tools/vulkan_pin.py). No cache is read or written.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash   # -eo pipefail
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.9'
          checksum: a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5   # uv-x86_64-unknown-linux-gnu.tar.gz
          enable-cache: false
      - name: Python 3.12 and 3.14
        # .venv as the lifter's tests want it; .venv-py314 for the ones that need compression.zstd (the installer's)
        run: |
          uv python install -q 3.14.9
          uv venv -q --python 3.12 .venv
          uv venv -q --python 3.14.9 .venv-py314
          for py in .venv/bin/python .venv-py314/bin/python; do
            uv pip install -q --python "$py" --require-hashes -r tools/ci_requirements_tests.txt
          done
      - name: Headers and a display
        # vk_mem_alloc.h and Vulkan headers new enough for the runtime (Ubuntu 24.04's are 1.3); xvfb-run gives the
        # launcher's and the installer's window tests a display
        run: |
          .venv/bin/python -c 'import sys; sys.path.insert(0, "tools"); import build_game; print("VMA:", build_game.vma_include())'
          .venv/bin/python tools/vulkan_pin.py
          echo "CPATH=$PWD/toolchain/vulkan-headers/include" >> "$GITHUB_ENV"
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          clang --version | head -1
      - name: Tests
        run: xvfb-run -a .venv/bin/python tests/run.py
      - name: Tests on Python 3.14
        if: ${{ !cancelled() }}
        run: xvfb-run -a .venv-py314/bin/python tests/run.py --needs py:compression.zstd
      - if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs
          retention-days: 14
          path: build/test-runs/
